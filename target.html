
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Get a $750 Target Gift Card - Exclusive Rewards & Deals</title>
    <meta name="description" content="Claim your $750 Target gift card today. Complete quick steps and deals to earn exclusive cash rewards and premium Target shopping credits. Available for a limited time.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --brand-color: #CC0000; /* Target Red */
            --bg-light: #F4F7FA; /* Clean, premium off-white */
        }

        body {
            background-color: var(--bg-light);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            overscroll-behavior-y: none; /* Native app feel */
            font-family: 'Inter', sans-serif;
            color: #1e293b;
        }

        /* --- PLATFORM VIEW --- */
        #main-view {
            height: 100dvh;
            overflow-y: auto;
            overflow-x: hidden; 
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
        }

        .brand-logo-large {
            width: 64px; 
            height: 64px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); 
            border: 1px solid #f1f5f9;
            background: #fff;
            object-fit: cover;
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body>

    <!-- SINGLE PLATFORM VIEW -->
    <div id="main-view" class="w-full">
        
        <!-- Main Scrollable/Flex Area -->
        <div class="w-full max-w-md mx-auto px-5 pt-8 flex flex-col flex-grow h-full justify-center">

            <!-- Circular Logo & Title Section -->
            <div class="flex flex-col items-center justify-center mb-4 shrink-0">
                <img src="https://www.pngall.com/wp-content/uploads/13/Target-Logo-PNG-HD-Image.png" alt="Target Logo" class="brand-logo-large mb-2">
                <h1 class="text-[1.35rem] font-extrabold text-slate-900 tracking-tight text-center leading-tight">
                    <span>Target</span> Reward
                </h1>
            </div>

            <!-- Reward Card -->
            <div class="rounded-xl p-4 shadow-sm mb-4 relative overflow-hidden flex justify-between items-center text-white shrink-0" style="background-color: var(--brand-color);">
                <div class="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent pointer-events-none"></div>
                <div class="absolute -right-6 -top-6 w-24 h-24 bg-white opacity-10 rounded-full pointer-events-none"></div>
                
                <div class="relative z-10">
                    <div class="text-3xl font-extrabold tracking-tight mb-0.5 drop-shadow-sm">$750</div>
                    <div class="font-semibold text-[11px] uppercase tracking-wider opacity-90">Reward Value</div>
                </div>
                <div class="relative z-10 bg-white/20 p-2.5 rounded-full backdrop-blur-sm shadow-sm border border-white/10">
                    <i data-lucide="gift" class="w-6 h-6 text-white"></i>
                </div>
            </div>

            <!-- Application Process -->
            <div class="flex-grow flex flex-col justify-center">
                <h2 class="text-slate-900 font-extrabold mb-3 text-[1rem] text-center tracking-tight leading-snug">
                    Complete the steps below.
                </h2>
                
                <div class="space-y-2">
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex gap-3 items-center">
                        <div class="w-8 h-8 shrink-0 rounded-full text-white flex items-center justify-center font-bold text-sm shadow-inner" style="background-color: var(--brand-color);">1</div>
                        <div class="font-bold text-slate-800 text-[13px]">Click the button below</div>
                    </div>

                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex gap-3 items-center">
                        <div class="w-8 h-8 shrink-0 rounded-full text-white flex items-center justify-center font-bold text-sm shadow-inner" style="background-color: var(--brand-color);">2</div>
                        <div class="font-bold text-slate-800 text-[13px]">Enter your email & basic info</div>
                    </div>

                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex gap-3 items-center">
                        <div class="w-8 h-8 shrink-0 rounded-full text-white flex items-center justify-center font-bold text-sm shadow-inner" style="background-color: var(--brand-color);">3</div>
                        <div class="font-bold text-slate-800 text-[13px]">Complete 4 to 5 required deals</div>
                    </div>

                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex gap-3 items-center">
                        <div class="w-8 h-8 shrink-0 rounded-full text-white flex items-center justify-center font-bold text-sm shadow-inner" style="background-color: var(--brand-color);">4</div>
                        <div class="font-bold text-slate-800 text-[13px]">Receive your reward once verified</div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Button Area -->
        <div class="w-full max-w-md mx-auto px-5 pb-5 pt-3">
            <button id="startBtn" class="w-full text-white rounded-xl py-3.5 font-bold text-[1.05rem] shadow-md transition-transform hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2 relative cursor-pointer" style="background-color: var(--brand-color);">
                <span id="btnText" class="flex items-center gap-2 transition-opacity duration-200">
                    Claim Reward
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </span>
                <i id="btnSpinner" data-lucide="loader-2" class="w-6 h-6 animate-spin absolute opacity-0 transition-opacity duration-200 pointer-events-none"></i>
            </button>
            
            <p class="text-center text-[10px] font-semibold text-slate-400 mt-3 uppercase tracking-wider">
                Available in US, CA, AU, UK
            </p>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // Target affiliate URL hardcoded
        const targetUrl = 'https://linkthem.net/aff_c?offer_id=1381&aff_id=171242';
        
        const startBtn = document.getElementById('startBtn');

        // Setup CTA Button Loading Logic
        function setLoadingState(isLoading) {
            const dynBtnText = document.getElementById('btnText');
            const dynBtnSpinner = document.getElementById('btnSpinner');
            
            if (!dynBtnText || !dynBtnSpinner) return;

            if (isLoading) {
                dynBtnText.classList.add('opacity-0');
                dynBtnSpinner.classList.remove('opacity-0');
                startBtn.classList.add('pointer-events-none');
            } else {
                dynBtnText.classList.remove('opacity-0');
                dynBtnSpinner.classList.add('opacity-0');
                startBtn.classList.remove('pointer-events-none');
            }
        }

        startBtn.addEventListener('click', (e) => {
            e.preventDefault();
            setLoadingState(true);
            
            // Redirect to the exact affiliate link for Target
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 200);

            // Safety fallback: reset button after 2.5 seconds just in case
            setTimeout(() => {
                setLoadingState(false);
            }, 2500);
        });

        // Reset state on back navigation
        window.addEventListener('pageshow', (event) => {
            if (event.persisted || (window.performance && window.performance.navigation.type === 2)) {
                setLoadingState(false);
            }
        });

        // Bulletproof back-button reset using the Page Visibility API
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible') {
                setLoadingState(false);
            }
        });

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            setLoadingState(false);
        });
    </script>
</body>
</html>
